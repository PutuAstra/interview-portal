name: Deploy API Worker

# Auto-deploys the API worker whenever worker.js (or its deploy config) lands on
# main — gated by syntax-check + unit tests. Can also be run manually.
# Frontend files (admin.js/take.html/etc.) deploy separately via Cloudflare's
# git integration for the static site, so they're intentionally NOT triggers here.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'deploy/wrangler.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Gate: never deploy a worker that fails syntax-check or unit tests.
      - name: Syntax check
        run: node --check worker.js
      - name: Unit tests
        run: npm test

      - name: Deploy interview-api
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config deploy/wrangler.toml
