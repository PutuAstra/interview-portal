<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Talent — ZeusHire</title>
  <link rel="icon" type="image/png" href="cti-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20250528b" />
  <style>
    .lib-container { min-height:100vh; display:flex; flex-direction:column; background:var(--bg); }
    .lib-topbar { display:flex; align-items:center; justify-content:space-between; padding:0 24px; height:56px; background:var(--card); border-bottom:1px solid var(--border); flex-shrink:0; }
    .lib-brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; color:var(--text); }
    .lib-body { flex:1; max-width:1200px; margin:0 auto; padding:24px 20px; width:100%; box-sizing:border-box; }
    .lib-filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .lib-filters select, .lib-filters input { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); font-size:13px; }
    .lib-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
    .cand-card { border:1px solid var(--border); border-radius:12px; background:var(--card); padding:16px; display:flex; flex-direction:column; gap:12px; }
    .cand-head { display:flex; align-items:center; gap:12px; min-width:0; }
    .cand-avatar { width:52px; height:52px; border-radius:50%; flex-shrink:0; object-fit:cover; background:var(--bg); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--text-2); font-size:16px; overflow:hidden; }
    .cand-avatar img { width:100%; height:100%; object-fit:cover; }
    .cand-name { font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cand-tags { display:flex; gap:5px; flex-wrap:wrap; }
    .cand-tag { font-size:10px; font-weight:600; padding:2px 8px; border-radius:10px; background:var(--bg); border:1px solid var(--border); color:var(--text-2); }
    .cand-card video { width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; display:block; }
    .badge-client { display:inline-flex; align-items:center; gap:5px; background:rgba(245,158,11,0.12); color:#f59e0b; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; border:1px solid rgba(245,158,11,0.3); }
    /* Candidate detail modal */
    .cm-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto; z-index:1000; }
    .cm-overlay.open { display:flex; }
    .cm-modal { background:var(--card); border:1px solid var(--border); border-radius:14px; width:100%; max-width:1080px; margin:auto; display:flex; flex-direction:column; max-height:calc(100vh - 48px); overflow:hidden; }
    .cm-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 20px; border-bottom:1px solid var(--border); }
    .cm-body { padding:18px 20px; overflow-y:auto; display:flex; gap:18px; align-items:flex-start; }
    .cm-left { flex:1.5; min-width:0; display:flex; flex-direction:column; gap:10px; }
    .cm-right { flex:1; min-width:0; }
    .cm-vidgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
    .cm-vcard { border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--bg); display:flex; flex-direction:column; }
    .cm-vcard video { width:100%; aspect-ratio:16/9; background:#000; display:block; }
    .cm-vq { padding:8px 10px; font-size:11px; color:var(--text-2); line-height:1.4; }
    .cm-vq b { color:var(--accent); }
    .cm-ov { font-size:13px; color:var(--text-2); line-height:1.55; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:14px 16px; }
    .cm-footer { padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; flex-shrink:0; }
    .cm-x { background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; line-height:1; padding:0 4px; }
    @media (max-width:760px) { .cm-body { flex-direction:column; } .cm-left, .cm-right { width:100%; flex:none; } }
    @media (max-width:600px) { .cm-overlay { padding:0; } .cm-modal { max-width:none; min-height:100vh; max-height:100vh; border-radius:0; } }
  </style>
</head>
<body>
<div class="lib-container">
  <div class="lib-topbar" id="lib-topbar">
    <div class="lib-brand">
      <img src="cti-logo.png" alt="CTI" style="height:30px;width:auto" />
      <span id="brand-name">CTI ZeusHire</span>
      <span class="badge-client">⭐ Premium Talent</span>
    </div>
    <span class="text-muted text-sm" id="client-label"></span>
  </div>
  <div class="lib-body" id="lib-body">
    <div class="spinner" style="margin:80px auto"></div>
  </div>
</div>

<!-- Candidate detail modal -->
<div class="cm-overlay" id="cm-overlay" onclick="if(event.target===this)closeCandidate()">
  <div class="cm-modal">
    <div class="cm-header">
      <div style="min-width:0">
        <div class="cand-name" id="cm-name" style="font-size:18px"></div>
        <div class="cand-tags" id="cm-tags" style="margin-top:6px"></div>
      </div>
      <button class="cm-x" onclick="closeCandidate()">✕</button>
    </div>
    <div class="cm-body" id="cm-body"></div>
    <div class="cm-footer">
      <button class="btn btn-primary" id="cm-interest-btn" onclick="markInterestedFromModal()"></button>
    </div>
  </div>
</div>

<script>
const WORKER_URL = 'https://interview-api.putuastrawijaya.workers.dev';
const clientToken = new URLSearchParams(location.search).get('c');
let _candidates = [];

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function jsAttr(s){ return esc(s).replace(/'/g,'&#39;'); }
function showMsg(icon, title, body) {
  document.getElementById('lib-body').innerHTML =
    `<div style="max-width:460px;margin:80px auto;text-align:center"><div style="font-size:48px;margin-bottom:16px">${icon}</div><h2>${title}</h2><p class="text-muted mt-8">${body}</p></div>`;
}

async function boot() {
  if (!clientToken) return showMsg('⚠️','Link Invalid','No access token in this URL.');
  try {
    const res = await fetch(`${WORKER_URL}/api/clientlib/${clientToken}`);
    if (!res.ok) return showMsg('⚠️','Link Not Found','This library link is invalid or has been revoked.');
    const data = await res.json();
    applyBranding(data.branding || {});
    document.getElementById('client-label').textContent = data.label || '';
    _candidates = data.candidates || [];
    renderFilters();
    renderGrid();
  } catch {
    showMsg('⚠️','Connection Error','Could not connect to the server. Please try again later.');
  }
}

function applyBranding(b) {
  if (b.brandColor) {
    document.documentElement.style.setProperty('--accent', b.brandColor);
    document.getElementById('lib-topbar').style.borderBottom = `1px solid ${b.brandColor}30`;
  }
  const name = b.brandName || 'CTI ZeusHire';
  document.getElementById('brand-name').textContent = name;
  document.title = name + ' — Premium Talent';
}

function renderFilters() {
  const cats = [...new Set(_candidates.map(c => c.category))].sort();
  const deps = [...new Set(_candidates.map(c => c.department))].sort();
  const roles = [...new Set(_candidates.map(c => c.role))].sort();
  const opt = (arr, label) => `<option value="all">${label}</option>` + arr.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  document.getElementById('lib-body').innerHTML = `
    <div class="lib-filters">
      <select id="f-cat" onchange="renderGrid()">${opt(cats,'All categories')}</select>
      <select id="f-dep" onchange="renderGrid()">${opt(deps,'All departments')}</select>
      <select id="f-role" onchange="renderGrid()">${opt(roles,'All roles')}</select>
    </div>
    <div id="grid" class="lib-grid"></div>`;
}

function renderGrid() {
  const fc = document.getElementById('f-cat')?.value || 'all';
  const fd = document.getElementById('f-dep')?.value || 'all';
  const fr = document.getElementById('f-role')?.value || 'all';
  const list = _candidates.filter(c =>
    (fc === 'all' || c.category === fc) &&
    (fd === 'all' || c.department === fd) &&
    (fr === 'all' || c.role === fr));
  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty-state">${_candidates.length ? 'No candidates match your filter.' : 'No candidates available at the moment.'}</div>`;
    return;
  }
  grid.innerHTML = list.map(cardHTML).join('');
  // Lazy-load each candidate's profile photo for the card avatar.
  list.forEach(loadCardPhoto);
}

function initials(name) {
  return String(name || '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
}

function cardLabel(c) {
  return c.alreadyInterested ? '✓ Interested · Review' : '🎥 Review';
}

function cardHTML(c) {
  return `
    <div class="cand-card">
      <div class="cand-head">
        <div class="cand-avatar" id="ph-${c.token}">${initials(c.candidateName)}</div>
        <div style="min-width:0">
          <div class="cand-name">${esc(c.candidateName)}</div>
          <div class="cand-tags" style="margin-top:5px">
            <span class="cand-tag">${esc(c.category)}</span>
            <span class="cand-tag">${esc(c.department)}</span>
            <span class="cand-tag" style="color:var(--accent);border-color:var(--accent)">${esc(c.role)}</span>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" id="card-btn-${c.token}" style="width:100%;font-size:13px;padding:9px" onclick="openCandidate('${c.token}')">
        ${cardLabel(c)}
      </button>
    </div>`;
}

async function loadCardPhoto(c) {
  if (!c.profilePhotoItemId) return;
  try {
    const { downloadUrl } = await fetch(`${WORKER_URL}/api/clientlib/${clientToken}/photo/${c.token}`).then(r => r.json());
    const el = document.getElementById('ph-' + c.token);
    if (el && downloadUrl) el.innerHTML = `<img src="${downloadUrl}" alt="">`;
  } catch {}
}

// Render the overview nicely: an intro paragraph, optional section headers
// (lines ending with ":"), and bullet lists. Handles ❖, •, *, "- " markers.
function formatOverview(text) {
  const raw = String(text || '').trim();
  if (!raw) return '';
  // Put every bullet on its own line, normalized to "• ".
  const lines = raw
    .replace(/\s*[❖•]\s+/g, '\n• ')
    .replace(/\n\s*[-*]\s+/g, '\n• ')
    .split(/\n+/).map(s => s.trim()).filter(Boolean);

  let html = '';
  let inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  const openList  = () => { if (!inList) { html += '<ul style="margin:0 0 8px;padding-left:18px;display:flex;flex-direction:column;gap:5px">'; inList = true; } };

  for (const line of lines) {
    if (line.startsWith('• ')) {
      openList();
      html += `<li>${esc(line.slice(2).trim())}</li>`;
    } else if (/:$/.test(line) && line.length <= 40) {
      // Section header (e.g. "Experience:", "Skills & Education:").
      closeList();
      html += `<p style="margin:10px 0 4px;font-weight:700;color:var(--text)">${esc(line)}</p>`;
    } else {
      // Intro / free paragraph.
      closeList();
      html += `<p style="margin:0 0 8px">${esc(line)}</p>`;
    }
  }
  closeList();
  return html || `<p style="margin:0">${esc(raw)}</p>`;
}

// ── Candidate detail modal ──
let _cmToken = null;

function openCandidate(token) {
  const c = _candidates.find(x => x.token === token);
  if (!c) return;
  _cmToken = token;
  document.getElementById('cm-name').textContent = c.candidateName;
  document.getElementById('cm-tags').innerHTML = `
    <span class="cand-tag">${esc(c.category)}</span>
    <span class="cand-tag">${esc(c.department)}</span>
    <span class="cand-tag" style="color:var(--accent);border-color:var(--accent)">${esc(c.role)}</span>`;

  const vids = c.videos || [];
  document.getElementById('cm-body').innerHTML = `
    <div class="cm-left">
      <div style="font-size:12px;font-weight:700;color:var(--text-2)">🎥 Recorded answers (${vids.length})</div>
      ${vids.length
        ? `<div class="cm-vidgrid">${vids.map(v => `
            <div class="cm-vcard">
              <video id="cmvid-${v.questionIndex}" controls preload="none"></video>
              <div class="cm-vq"><b>Q${v.questionIndex + 1}</b> · ${esc(v.text || ('Question ' + (v.questionIndex + 1)))}</div>
            </div>`).join('')}</div>`
        : `<div class="text-muted text-sm">No video answers</div>`}
    </div>
    <div class="cm-right">
      <div style="font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:8px">📋 Overview</div>
      ${c.overview ? `<div class="cm-ov">${formatOverview(c.overview)}</div>` : `<div class="text-muted text-sm">No overview available.</div>`}
    </div>`;

  const ib = document.getElementById('cm-interest-btn');
  ib.disabled = !!c.alreadyInterested;
  ib.textContent = c.alreadyInterested ? '✓ Interested' : '⭐ Interested';

  document.getElementById('cm-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  // Lazy-load each answer video URL.
  vids.forEach(async v => {
    try {
      const { downloadUrl } = await fetch(`${WORKER_URL}/api/clientlib/${clientToken}/video/${token}/${v.questionIndex}`).then(r => r.json());
      const el = document.getElementById('cmvid-' + v.questionIndex);
      if (el && downloadUrl) el.src = downloadUrl;
    } catch {}
  });
}

function closeCandidate() {
  const ov = document.getElementById('cm-overlay');
  ov.querySelectorAll('video').forEach(v => { try { v.pause(); } catch {} });
  ov.classList.remove('open');
  document.body.style.overflow = '';
  _cmToken = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCandidate(); });

async function markInterestedFromModal() {
  const token = _cmToken;
  if (!token) return;
  const btn = document.getElementById('cm-interest-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await fetch(`${WORKER_URL}/api/clientlib/${clientToken}/interest/${token}`, { method: 'POST' });
    if (!res.ok) throw new Error();
    btn.textContent = '✓ Interested';
    const c = _candidates.find(x => x.token === token);
    if (c) c.alreadyInterested = true;
    const cardBtn = document.getElementById('card-btn-' + token);
    if (cardBtn) cardBtn.textContent = cardLabel(c);
  } catch {
    btn.disabled = false; btn.textContent = '⭐ Interested';
    alert('Could not register interest. Please try again.');
  }
}

boot();
</script>
</body>
</html>
